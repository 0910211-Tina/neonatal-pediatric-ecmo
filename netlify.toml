[build]
  publish = "."

# ── 安全性標頭 ─────────────────────────────────────────────────────
# 這個站是純靜態頁面：沒有後端、沒有資料庫、沒有登入、沒有任何 API 金鑰。
# 下面的標頭把「頁面能對外連線的對象」收到最緊，等於斷掉追蹤與資料外送的路。
[[headers]]
  for = "/*"
  [headers.values]
    # 預設什麼都不准載入，再逐項開放本站自己需要的東西。
    # 外部字體、外部腳本、外部圖片、外部 API 一律被瀏覽器擋掉。
    Content-Security-Policy = "default-src 'none'; base-uri 'none'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-src 'self'; object-src 'self'"
    # 關掉這個網頁用不到的裝置權限
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # 不讓瀏覽器亂猜檔案型別
    X-Content-Type-Options = "nosniff"
    # 不准被別的網站嵌成 iframe（防冒名套殼）
    X-Frame-Options = "DENY"
    # 點外部連結時不外洩完整網址
    Referrer-Policy = "strict-origin-when-cross-origin"
    # 一律走 HTTPS
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # 不讓搜尋引擎收錄
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/handout/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
